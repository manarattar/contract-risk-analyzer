name: Deploy
on:
  push:
    branches: [master, feat/azure-ready]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/manarattar/contract-risk-analyzer-backend:${{ github.sha }}
            ghcr.io/manarattar/contract-risk-analyzer-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_API_URL=${{ vars.FRONTEND_URL }}
          tags: |
            ghcr.io/manarattar/contract-risk-analyzer-frontend:${{ github.sha }}
            ghcr.io/manarattar/contract-risk-analyzer-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container Apps
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SHA: ${{ github.sha }}
        run: |
          az containerapp update --name contract-analyzer-backend -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --image "ghcr.io/manarattar/contract-risk-analyzer-backend:$SHA"
          az containerapp update --name contract-analyzer-frontend -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --image "ghcr.io/manarattar/contract-risk-analyzer-frontend:$SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create Search index
        working-directory: backend
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          pip install -r requirements.txt
          SEARCH_NAME=$(az search service list -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query "[0].name" -o tsv)
          test -n "$SEARCH_NAME"
          python scripts/create_search_index.py --endpoint "https://$SEARCH_NAME.search.windows.net" --index contract-chunks
      - name: Check frontend health
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          curl --fail --show-error --silent "$FRONTEND_URL/api/health" || echo 'Health check unavailable; the database may be stopped.'
