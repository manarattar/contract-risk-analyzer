name: Review assistant verification
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      REVIEW_MODE: disabled
      REVIEW_PRINCIPALS_JSON: '[]'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r backend/requirements-test.txt
      - run: python -m pytest -p no:cacheprovider -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
